<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="pray, language placed before inference">
  <defs>
    <radialGradient id="void" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1a1614"/>
      <stop offset="42%" stop-color="#0c0a0e"/>
      <stop offset="100%" stop-color="#060608"/>
    </radialGradient>
    <radialGradient id="mist" cx="50%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity="0.1"/>
      <stop offset="38%" stop-color="#9eb9d4" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="plasma" cx="72%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9a87c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#c9a87c" stop-opacity="0.16"/>
    </linearGradient>
    <filter id="wet-echo" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="wet-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="n"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.9  0 0 0 0 0.88  0 0 0 0 0.82  0 0 0 0.035 0" in="n" result="g"/>
      <feBlend in="SourceGraphic" in2="g" mode="screen"/>
    </filter>
    <g id="dot-lg">
      <circle r="11" fill="#c9a87c"/>
      <circle r="5" fill="#f2e6d2" fill-opacity="0.55"/>
      <circle r="18" fill="#c9a87c" fill-opacity="0.12"/>
    </g>
    <g id="dash-lg">
      <rect x="-10" y="-34" width="20" height="68" rx="10" fill="#b89562"/>
      <rect x="-5" y="-26" width="10" height="52" rx="5" fill="#e8d4b0" fill-opacity="0.42"/>
      <rect x="-16" y="-40" width="32" height="80" rx="16" fill="#c9a87c" fill-opacity="0.1"/>
    </g>
  </defs>

  <rect width="1200" height="630" fill="url(#void)"/>
  <rect width="1200" height="630" fill="url(#mist)"/>
  <rect width="1200" height="630" fill="url(#plasma)"/>
  <ellipse cx="600" cy="300" rx="420" ry="210" fill="#c9a87c" fill-opacity="0.03" filter="url(#wet-echo)"/>

  <rect x="180" y="118" width="840" height="340" fill="url(#plinth)" opacity="0.55"/>
  <path d="M200 458h800" stroke="#c9a87c" stroke-opacity="0.18" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M220 132v300M980 132v300" stroke="#c9a87c" stroke-opacity="0.08" stroke-width="1"/>

  <g transform="translate(600 292)" filter="url(#wet-echo)" opacity="0.34">
    <g transform="translate(-252 0)">
      <use href="#dot-lg" transform="translate(0 -78)"/>
      <use href="#dash-lg" transform="translate(0 -22)"/>
      <use href="#dash-lg" transform="translate(0 34)"/>
      <use href="#dot-lg" transform="translate(0 90)"/>
    </g>
    <g transform="translate(-84 0)">
      <use href="#dot-lg" transform="translate(0 -56)"/>
      <use href="#dash-lg" transform="translate(0 0)"/>
      <use href="#dot-lg" transform="translate(0 56)"/>
    </g>
    <g transform="translate(84 0)">
      <use href="#dot-lg" transform="translate(0 -56)"/>
      <use href="#dash-lg" transform="translate(0 0)"/>
    </g>
    <g transform="translate(252 0)">
      <use href="#dash-lg" transform="translate(0 -78)"/>
      <use href="#dot-lg" transform="translate(0 -22)"/>
      <use href="#dash-lg" transform="translate(0 34)"/>
      <use href="#dash-lg" transform="translate(0 90)"/>
    </g>
  </g>

  <g transform="translate(600 292)" filter="url(#wet-glow)">
    <g transform="translate(-252 0)">
      <use href="#dot-lg" transform="translate(0 -78)"/>
      <use href="#dash-lg" transform="translate(0 -22)"/>
      <use href="#dash-lg" transform="translate(0 34)"/>
      <use href="#dot-lg" transform="translate(0 90)"/>
    </g>
    <g transform="translate(-84 0)">
      <use href="#dot-lg" transform="translate(0 -56)"/>
      <use href="#dash-lg" transform="translate(0 0)"/>
      <use href="#dot-lg" transform="translate(0 56)"/>
    </g>
    <g transform="translate(84 0)">
      <use href="#dot-lg" transform="translate(0 -56)"/>
      <use href="#dash-lg" transform="translate(0 0)"/>
    </g>
    <g transform="translate(252 0)">
      <use href="#dash-lg" transform="translate(0 -78)"/>
      <use href="#dot-lg" transform="translate(0 -22)"/>
      <use href="#dash-lg" transform="translate(0 34)"/>
      <use href="#dash-lg" transform="translate(0 90)"/>
    </g>
  </g>

  <g transform="translate(600 196)" opacity="0.55" filter="url(#wet-glow)">
    <text text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#c9a87c" letter-spacing="10">.--. &#183;-&#183; &#183;- -&#183;--</text>
  </g>

  <g filter="url(#grain)">
    <text x="600" y="518" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-style="italic" fill="rgba(236,228,218,0.22)" letter-spacing="12">pray</text>
    <text x="600" y="566" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="rgba(236,228,218,0.48)" letter-spacing="5.5">LANGUAGE PLACED BEFORE INFERENCE</text>
  </g>
</svg>
